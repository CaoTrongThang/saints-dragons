plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath.set(project(":common").loom.accessWidenerPath)

    runs.create("datagen") {
        data()
        programArgs("--all", "--mod", "saintsdragons")
        programArgs("--output", project(":common").file("src/main/generated/resources").absolutePath)
        programArgs("--existing", project(":common").file("src/main/resources").absolutePath)
    }
}

dependencies {
    mappings loom.officialMojangMappings()

    neoForge("net.neoforged:neoforge:${project.properties["neoforge_version"]}")
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modApi "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                minecraft_version: rootProject.minecraft_version,
                minecraft_version_range: rootProject.minecraft_version_range,
                neoforge_version: rootProject.neoforge_version,
                neoforge_version_range: rootProject.neoforge_version_range
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    archiveFileName.set("saintsdragons-${project.version}+neoforge-${rootProject.minecraft_version}.jar")
    inputFile.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    atAccessWideners.add("saintsdragons.accesswidener")
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = [
                'src/main/resources',
                '../common/src/main/resources',
                '../common/src/generated/resources'
        ]
    }
}


publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "saintsdragons-" + project.name
            from components.java
        }
    }
}
